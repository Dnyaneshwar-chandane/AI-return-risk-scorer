make_dataset:
  test_split: 0.2
  seed: 42

model:

  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: balanced

  random_forest:
    n_estimators: 500
    max_depth: 10
    class_weight: balanced

  xgboost:
    n_estimators: 1000
    max_depth: 10
    learning_rate: 0.1

  lightgbm:
    n_estimators: 1000
    max_depth: 10
    learning_rate: 0.1

  extra_trees:
    n_estimators: 200
    max_depth: null
    class_weight: balanced

  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.1
    max_leaf_nodes: 31

  knn:
    n_neighbors: 5
    weights: uniform
    p: 2

  svm:
    C: 1.0
    kernel: rbf
    class_weight: balanced
  
tuning:
  C:
    - 0.01
    - 0.1
    - 0.5
    - 1
    - 2
    - 5
    - 10
final_model:
  C: 2
  max_iter: 1000
  class_weight: balanced